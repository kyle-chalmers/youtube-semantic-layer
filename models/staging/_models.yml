version: 2

models:
  - name: metricflow_time_spine
    description: Daily time spine for MetricFlow.
    config:
      materialized: table
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
  - name: stg_video_metadata
    columns:
      - name: video_id
        data_tests: [unique, not_null]
