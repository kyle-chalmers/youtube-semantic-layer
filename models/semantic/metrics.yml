metrics:
  - name: total_seconds_watched
    description: "Total estimated seconds watched."
    label: Seconds Watched
    type: simple
    type_params:
      measure: total_seconds_watched

  - name: total_views
    description: "Total views."
    label: Views
    type: simple
    type_params:
      measure: total_views

  - name: avg_view_duration_seconds
    description: "Average view duration in seconds: total watch time divided by total views."
    label: Average View Duration (seconds)
    type: ratio
    type_params:
      numerator: total_seconds_watched
      denominator: total_views

  - name: total_minutes_watched
    description: "Total estimated minutes watched."
    label: Minutes Watched
    type: simple
    type_params:
      measure: minutes_watched
