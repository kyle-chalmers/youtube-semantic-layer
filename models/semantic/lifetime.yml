semantic_models:
  - name: video_lifetime_snapshots
    description: "Lifetime view, like and comment counts per video per snapshot date (Data API), from 2026-02-17. Running totals: they add across videos, and over time the latest snapshot in the period is used."
    model: ref('fct_video_lifetime_snapshots')
    defaults:
      agg_time_dimension: snapshot_date
    entities:
      - name: video_lifetime_snapshot
        type: primary
        expr: row_key
      - name: video
        type: foreign
        expr: video_id
    dimensions:
      - name: snapshot_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: lifetime_views
        agg: sum
        expr: view_count
        non_additive_dimension:
          name: snapshot_date
          window_choice: max
      - name: lifetime_likes
        agg: sum
        expr: like_count
        non_additive_dimension:
          name: snapshot_date
          window_choice: max
      - name: lifetime_comments
        agg: sum
        expr: comment_count
        non_additive_dimension:
          name: snapshot_date
          window_choice: max

metrics:
- name: lifetime_views
  label: Lifetime Views
  description: 'Lifetime view count from the Data API at the latest snapshot in the period. Running total:
    compare snapshots, never add across days. Data API timing, not Pacific days.'
  type: simple
  type_params:
    measure: lifetime_views
  config:
    meta:
      coverage_start: '2026-02-17'
      source: daily_video_stats
- name: lifetime_likes
  label: Lifetime Likes
  description: Lifetime like count at the latest snapshot in the period. Running total.
  type: simple
  type_params:
    measure: lifetime_likes
  config:
    meta:
      coverage_start: '2026-02-17'
      source: daily_video_stats
- name: lifetime_comments
  label: Lifetime Comments
  description: Lifetime comment count at the latest snapshot in the period. Running total.
  type: simple
  type_params:
    measure: lifetime_comments
  config:
    meta:
      coverage_start: '2026-02-17'
      source: daily_video_stats
