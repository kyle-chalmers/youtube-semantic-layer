name: Metric canary

# Mondays after the pipeline's Sunday refresh, and on demand. A moved number fails the run;
# the log names the metric and month but never the values (this repo is public). Values go to
# BigQuery: canary_runs (every run) and canary_baseline (approved.csv).
on:
  schedule:
    - cron: "17 6 * * 1"
      timezone: America/Phoenix
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_PROFILES_DIR: ci
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/python -q

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Build models and run data tests
        run: dbt build --quiet

      - name: Validate metrics
        run: mf validate-configs

      - name: Glossary is current
        run: python scripts/build_glossary.py --check

      - name: Canary
        run: python canary/check_metrics.py --quiet --record
